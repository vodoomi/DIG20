[general]
description = Noto Peninsula Earthquake 2024 Scenario Risk
# 【重要】計算モードをハザードからリスクに変更します
calculation_mode = scenario_risk

[rupture]
rupture_model_file = rupture_model.xml

[site_params]
site_model_file = site_model.csv

[hazard_calculation]
intensity_measure_types = PGA, SA(0.3), SA(0.6), SA(1.0)
# 日本の地震に対応する Morikawa and Fujiwara (2013) の浅部地殻内地震モデルを指定
gsim = MorikawaFujiwara2013Crustal
truncation_level = 3.0
maximum_distance = 200.0
number_of_ground_motion_fields = 1000
random_seed = 42

[exposure]
# 【新規】建物の曝露データを指定
exposure_file = exposure_model.xml

[vulnerability]
# 【新規】建物の被害率（脆弱性）関数ファイルを指定
structural_vulnerability_file = structural_vulnerability.xml