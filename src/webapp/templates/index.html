<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地震保険 即時補償額デモ</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
</head>
<body>
  <header id="top-bar">
    <h1>ジシンプラス保険</h1>
    <!-- モード切替(mock/live)と直接計算モードのUIは撤去済み。
         バックエンド(POST /api/mode, POST /chat_direct)は残っており、必要ならcurl等で切替可能。 -->
  </header>

  <main>
    <section id="chat-panel">
      <div id="messages"></div>

      <div id="quick-reply-slot">
        {% for reply in quick_replies %}
        <button type="button" class="preset-btn" data-message="{{ reply.message }}"
          onclick="setQuickReply(this.dataset.message)">
          {{ reply.label }}
        </button>
        {% endfor %}
      </div>

      <form id="chat-form" hx-post="/chat" hx-target="#messages" hx-swap="beforeend"
            hx-indicator="#spinner" hx-on::after-request="this.reset(); refreshMapState();">
        <input type="text" name="message" id="message-input"
               placeholder="選択肢を選ぶか、質問を入力してください" required>
        <button type="submit">送信</button>
        <span id="spinner" class="htmx-indicator">考え中...</span>
      </form>

    </section>

    <section id="map-panel">
      <div id="map"></div>
      <div id="legend"></div>
    </section>
  </main>

  <script src="/static/vendor/leaflet.js"></script>
  <script src="/static/map.js"></script>
  <script>
    function setQuickReply(message) {
      const input = document.getElementById('message-input');
      input.value = message;
      input.focus();
    }

    function renderMath(el) {
      if (window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
          ],
        });
        fitDisplayMath(el);
      }
    }

    function fitDisplayMath(root) {
      root.querySelectorAll('.katex-display').forEach((display) => {
        const formula = display.querySelector(':scope > .katex');
        if (!formula) return;

        formula.style.fontSize = '';
        if (formula.scrollWidth <= display.clientWidth) return;

        // 基本の0.95emから、必要な数式だけ0.72emを下限に縮小する。
        const fittedSize = Math.max(
          0.72,
          0.95 * display.clientWidth / formula.scrollWidth * 0.98,
        );
        formula.style.fontSize = `${fittedSize}em`;
      });
    }

    // htmxで新着メッセージ(#messages配下)がDOMに追加されるたびに数式を描画する
    document.body.addEventListener('htmx:afterSwap', (evt) => renderMath(evt.detail.target));
    document.body.addEventListener('htmx:oobAfterSwap', (evt) => renderMath(evt.detail.target));
    window.addEventListener('resize', () => fitDisplayMath(document));
  </script>
</body>
</html>
