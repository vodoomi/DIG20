<div class="msg msg-user">{{ user_message }}</div>
<div class="msg msg-assistant">{{ assistant_message_html | safe }}</div>
<div id="quick-reply-slot" hx-swap-oob="true">
  {% for reply in quick_replies %}
  <button type="button" class="preset-btn" data-message="{{ reply.message }}"
    onclick="setQuickReply(this.dataset.message)">
    {{ reply.label }}
  </button>
  {% endfor %}
</div>
